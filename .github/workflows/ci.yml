name: CI

# Fast checks that need no database. Deliberately NOT run here:
#   - `npm run lint`      — the repo baseline has pre-existing eslint errors in
#                           unrelated files; wire this in after that cleanup.
#   - `npm run test:e2e`  — needs a Postgres service + seeded schema; add as a
#                           separate job when that infra is set up.

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
